name: Nightly Pasomaru Import

on:
  schedule:
    # 毎日 UTC 18:00（日本時間 翌朝 3:00）に実行
    - cron: '0 18 * * 0-5'
    # 日本時間の日曜朝は全件走査し、深いページの未登録商品も回収する
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      full_scan:
        description: '全ページ走査（取りこぼし回収・商品名補修）'
        type: boolean
        default: false

concurrency:
  group: pasomaru-import
  cancel-in-progress: false

jobs:
  run-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir beautifulsoup4 gspread oauth2client requests

      - name: Create credentials.json from Secrets
        env:
          # 正しいシークレット名 (GCP_CREDENTIALS) に修正
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > credentials.json

      - name: Run import script
        env:
          FULL_SCAN: ${{ github.event_name == 'schedule' && github.event.schedule == '0 18 * * 6' || inputs.full_scan == true }}
        run: |
          if [ "$FULL_SCAN" = "true" ]; then
            python -u import_pasomaru.py --full-scan
          else
            python -u import_pasomaru.py --max-known-pages 5
          fi
